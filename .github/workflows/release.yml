name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  tests:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install build
      - run: python -m build --wheel
      - name: Attach the wheel to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wheel=$(ls dist/*-py3-none-any.whl)
          case "$wheel" in
            *-"${GITHUB_REF_NAME#v}"-py3-none-any.whl) ;;
            *) echo "Tag $GITHUB_REF_NAME does not match $wheel" >&2; exit 1 ;;
          esac
          gh release create "$GITHUB_REF_NAME" "$wheel" --verify-tag --generate-notes
      - name: Record the wheel digest
        run: sha256sum dist/*-py3-none-any.whl >> "$GITHUB_STEP_SUMMARY"
